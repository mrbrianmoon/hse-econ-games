<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulls, Bears &amp; Bonds | HSE Economics</title>
<style>
:root{
  --royal:#004AA0; --royal-dark:#003A80; --red:#C8102E; --gray:#C6C8CE; --navy:#14213A;
  --bg:#EEF1F6; --card:#FFFFFF; --ink:#14213A; --muted:#5B6576; --line:#DCE1EA;
  --up:#13803B; --down:#C8102E; --gold:#E0A100;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;}
button{font-family:inherit;font-size:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:16px;}
.serif{font-family:Georgia,"Times New Roman",serif;}
.up{color:var(--up);} .down{color:var(--down);} .muted{color:var(--muted);}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 120px;}

/* top bar */
.topbar{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--royal),var(--royal-dark));color:#fff;border-bottom:4px solid var(--red);}
.topbar .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.brand{font-family:Georgia,serif;font-weight:bold;font-size:20px;letter-spacing:.3px;margin-right:auto;white-space:nowrap;}
.brand small{display:block;font-family:"Trebuchet MS",sans-serif;font-weight:normal;font-size:11px;letter-spacing:2px;opacity:.8;text-transform:uppercase;}
.stat{background:rgba(255,255,255,.12);border-radius:8px;padding:4px 10px;text-align:right;min-width:92px;}
.stat b{display:block;font-size:17px;}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:1px;opacity:.85;}
.iconbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:8px;padding:8px 10px;font-size:18px;line-height:1;}

/* cards and layout */
.card{background:var(--card);border-radius:14px;box-shadow:0 1px 4px rgba(20,30,60,.12);padding:18px;margin:16px 0;}
h1,h2,h3{font-family:Georgia,serif;margin:0 0 8px;}
h1{font-size:30px;color:var(--royal-dark);} h2{font-size:24px;color:var(--royal-dark);} h3{font-size:18px;}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:bold;background:var(--royal);color:#fff;min-height:44px;}
.btn:hover{filter:brightness(1.08);} .btn:disabled{opacity:.45;cursor:not-allowed;filter:none;}
.btn.red{background:var(--red);} .btn.ghost{background:#fff;color:var(--royal);border:2px solid var(--royal);} .btn.big{font-size:19px;padding:14px 26px;}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px;}
.chip{display:inline-block;font-size:12px;font-weight:bold;border-radius:20px;padding:2px 9px;margin:0 4px 4px 0;background:#E6ECF6;color:var(--royal-dark);}
.chip.red{background:#FBE3E7;color:var(--red);} .chip.gold{background:#FFF3CC;color:#7A5800;} .chip.green{background:#DDF3E4;color:var(--up);} .chip.gray{background:#ECEEF2;color:#4A5262;}
.grid{display:grid;gap:14px;}
.g2{grid-template-columns:1fr 1fr;} .g3{grid-template-columns:repeat(3,1fr);} .g4{grid-template-columns:repeat(4,1fr);}
@media (max-width:900px){.g3,.g4{grid-template-columns:1fr 1fr;} .g3.keep{grid-template-columns:repeat(3,1fr);} .g4.keep{grid-template-columns:repeat(4,1fr);}}
@media (max-width:640px){.g4.keep{grid-template-columns:1fr 1fr;}}
@media (max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr;} .brand{font-size:17px;} .stat{min-width:0;}}

/* start */
.hero{background:linear-gradient(135deg,var(--royal),var(--royal-dark));color:#fff;border-radius:16px;padding:28px;margin-top:20px;border-bottom:6px solid var(--red);position:relative;overflow:hidden;}
.hero h1{color:#fff;font-size:40px;margin-bottom:6px;}
.hero p{font-size:18px;margin:0;opacity:.95;max-width:680px;}
.hero .kick{font-size:12px;letter-spacing:3px;text-transform:uppercase;opacity:.8;margin-bottom:6px;}
.hero svg{position:absolute;right:18px;bottom:0;opacity:.18;}
label.f{display:block;font-weight:bold;margin:12px 0 4px;}
.inp{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff;}
.inp:focus{outline:none;border-color:var(--royal);}
.steps{margin:0;padding-left:22px;} .steps li{margin:6px 0;}

/* briefing */
.ind{background:#F6F8FC;border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.ind .lab{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
.ind .val{font-size:26px;font-weight:bold;font-family:Georgia,serif;}
.ind .sub{font-size:13px;}
.cycle{display:flex;gap:4px;margin-top:6px;}
.cycle span{flex:1;text-align:center;font-size:11px;padding:3px 0;border-radius:6px;background:#E6E9EF;color:#6B7383;}
.cycle span.on{background:var(--royal);color:#fff;font-weight:bold;}
.news{border-left:6px solid var(--red);background:#fff;border-radius:10px;padding:14px 16px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.news .tag{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.news .hl{font-family:Georgia,serif;font-size:19px;font-weight:bold;}
.qbox{border:3px solid var(--royal);border-radius:14px;padding:16px;background:#F5F8FF;}
.qbox .qp{font-size:19px;font-weight:bold;margin-bottom:10px;}
.qopt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:16px;color:var(--ink);}
.qopt:hover{border-color:var(--royal);}
.qopt.wrong{border-color:var(--red);background:#FDECEF;color:#8A0C20;cursor:not-allowed;}
.qopt.right{border-color:var(--up);background:#E3F5E9;color:#0B5D2A;font-weight:bold;}
.hint{margin-top:10px;padding:10px 12px;border-radius:10px;background:#FFF5D6;color:#5C4500;}
.hint.ask{background:#FDE7EA;color:#7D0A1C;font-weight:bold;}

/* trading desk */
.tabs{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap;}
.tab{border:2px solid var(--royal);background:#fff;color:var(--royal);border-radius:30px;padding:9px 18px;font-weight:bold;}
.tab.on{background:var(--royal);color:#fff;}
.acards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
@media (max-width:1000px){.acards{grid-template-columns:1fr 1fr;}}
@media (max-width:640px){.acards{grid-template-columns:1fr;}}
.ac{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(20,30,60,.12);padding:12px 14px;border-top:4px solid var(--royal);display:flex;flex-direction:column;}
.ac.bond{border-top-color:#5A6B8A;} .ac.owned{box-shadow:0 0 0 2px var(--gold),0 1px 3px rgba(20,30,60,.12);}
.ac .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.ac .tk{font-weight:bold;font-size:13px;color:var(--muted);letter-spacing:1px;}
.ac .nm{font-family:Georgia,serif;font-weight:bold;font-size:17px;}
.ac .px{font-size:22px;font-weight:bold;text-align:right;white-space:nowrap;}
.ac .chg{font-size:13px;text-align:right;white-space:nowrap;}
.ac .bl{font-size:13px;color:var(--muted);margin:6px 0;flex:1;}
.ac .facts{font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px;margin:4px 0 8px;}
.ac .facts b{font-weight:bold;}
.spark{width:100%;height:34px;display:block;margin:4px 0;}
.own{font-size:13px;background:#FFF8E1;border-radius:8px;padding:5px 8px;margin-bottom:8px;}
.trade{display:flex;gap:6px;align-items:center;}
.qty{display:flex;align-items:center;border:2px solid var(--line);border-radius:10px;overflow:hidden;}
.qty button{border:0;background:#EEF1F6;width:36px;height:40px;font-size:20px;color:var(--royal);}
.qty input{width:58px;border:0;text-align:center;height:40px;font-size:16px;-moz-appearance:textfield;}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.trade .btn{padding:8px 12px;min-height:40px;font-size:15px;}
.trade .buy{background:var(--up);} .trade .sell{background:var(--red);}
.est{font-size:12px;color:var(--muted);margin-top:4px;min-height:16px;}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#fff;border-top:3px solid var(--royal);box-shadow:0 -4px 14px rgba(0,0,0,.12);}
.dock .in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.dock .m{font-size:13px;color:var(--muted);} .dock .m b{display:block;font-size:19px;color:var(--ink);}
.dock .go{margin-left:auto;}
@media (max-width:640px){.dock .in{gap:10px;padding:8px 12px;} .dock .note{display:none;} .dock .m b{font-size:16px;} .dock .go{width:100%;font-size:17px;padding:10px;} .topbar{position:static;} .wrap{padding-bottom:150px;}}
details.nd{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:10px 14px;margin-top:14px;}
details.nd summary{font-weight:bold;cursor:pointer;color:var(--royal-dark);}
details.nd li{margin:6px 0;}
table.t{width:100%;border-collapse:collapse;font-size:14px;}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:2px solid var(--line);padding:6px;}
table.t td{border-bottom:1px solid var(--line);padding:8px 6px;}
table.t td.r,table.t th.r{text-align:right;}
.alloc{display:flex;height:22px;border-radius:11px;overflow:hidden;margin:8px 0;}
.alloc div{height:100%;}
.flash{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-weight:bold;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center;}
.flash.bad{background:var(--red);}

/* market run */
.runhead{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;}
.bigval{font-family:Georgia,serif;font-size:44px;font-weight:bold;line-height:1;}
.prog{height:10px;background:#E1E6EE;border-radius:5px;overflow:hidden;margin:10px 0 2px;}
.prog div{height:100%;background:linear-gradient(90deg,var(--royal),var(--red));width:0;}
canvas.chart{width:100%;height:260px;display:block;}
.feed{max-height:300px;overflow:auto;}
.feed .it{padding:8px 10px;border-radius:8px;margin:6px 0;background:#F1F4FA;font-size:14px;animation:pop .35s ease;}
.feed .it.news{border-left:5px solid var(--royal);} .feed .it.surprise{border-left:5px solid var(--gold);} .feed .it.alarm{border-left:5px solid var(--red);background:#FDECEF;} .feed .it.pay{border-left:5px solid var(--up);background:#E8F6EC;}
@keyframes pop{from{transform:scale(.96);opacity:0;}to{transform:scale(1);opacity:1;}}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
@media (max-width:900px){.board{grid-template-columns:repeat(3,1fr);}}
@media (max-width:520px){.board{grid-template-columns:repeat(2,1fr);}}
.tile{border-radius:8px;padding:6px 8px;background:#F4F6FA;font-size:13px;transition:background .25s;}
.tile b{display:block;font-size:12px;letter-spacing:1px;}
.tile.mine{box-shadow:inset 0 0 0 2px var(--gold);}
.tile.u{background:#E2F4E8;} .tile.d{background:#FBE5E9;}
.speed .btn{margin-left:6px;}
.legend{font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;}
.legend i{display:inline-block;width:18px;height:4px;vertical-align:middle;margin-right:5px;border-radius:2px;}

/* debrief */
.res{border-radius:12px;padding:14px 16px;margin:10px 0;border-left:6px solid var(--up);background:#F1FAF4;}
.res.miss{border-left-color:var(--gold);background:#FFF8E6;}
.res.bad{border-left-color:var(--red);background:#FDEEF1;}
.res .hd{font-weight:bold;margin-bottom:4px;}
.mv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px;}

/* final */
.report{max-width:780px;margin:18px auto;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(20,30,60,.18);overflow:hidden;}
.rb{background:linear-gradient(135deg,var(--royal),var(--royal-dark));color:#fff;padding:18px 22px;border-bottom:6px solid var(--red);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.rb .k{font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:.85;}
.rb h2{color:#fff;font-size:28px;margin:2px 0 0;}
.rb .who{text-align:right;font-size:15px;}
.rbody{padding:14px 22px;}
.rbody .grid{gap:10px;} .kpi{padding:9px;}
.kpi{background:#F6F8FC;border-radius:12px;padding:12px;text-align:center;border:1px solid var(--line);}
.kpi .v{font-family:Georgia,serif;font-size:26px;font-weight:bold;}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
.badge{display:inline-block;background:var(--gold);color:#2B1F00;font-weight:bold;border-radius:30px;padding:6px 16px;font-size:16px;}
.vcode{font-family:"Courier New",monospace;font-size:30px;font-weight:bold;letter-spacing:6px;color:var(--royal-dark);background:#EEF3FF;border:2px dashed var(--royal);border-radius:12px;padding:10px 16px;display:inline-block;}
textarea.refl{width:100%;min-height:84px;padding:12px;border:2px solid var(--line);border-radius:10px;}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal .box{background:#fff;border-radius:14px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto;}
.center{text-align:center;}
.hide{display:none!important;}
</style>
</head>

  /* Brownian bridge from 0 to target (log space) with jumps at given ticks */
  function makePath(r, start, target, sigma, jumps) {
    var w = [0], step = sigma / Math.sqrt(N), i;
    for (i = 1; i <= N; i++) w.push(w[i - 1] + gauss(r) * step);

      var x = (i / N) * (target - jt) + w[i] - (i / N) * w[N];
      jumps.forEach(function (j) { if (i >= j.tick) x += j.size; });
      path.push(start * Math.exp(x));
    }
    return path;
  }

function drawLines(c, w, h, series, totalPts) {

  var mn = Math.min.apply(null, all.concat([START_CASH])), mx = Math.max.apply(null, all.concat([START_CASH]));
  var pad = (mx - mn) * 0.12 + 50; mn -= pad; mx += pad;
  var L = 62, R = 10, T = 10, Bm = 24;
  c.font = '12px Trebuchet MS'; c.fillStyle = '#5B6576'; c.strokeStyle = '#E3E7EE'; c.lineWidth = 1;
  for (var i = 0; i <= 4; i++) {
    var v = mn + (mx - mn) * i / 4, y = T + (h - T - Bm) * (1 - i / 4);
    c.beginPath(); c.moveTo(L, y); c.lineTo(w - R, y); c.stroke();
    c.fillText('$' + Math.round(v).toLocaleString('en-US'), 2, y + 4);
  }
  MONTHS.forEach(function (mname, k) { c.fillText(mname.slice(0, 3), L + (w - L - R) * (k + 0.5) / 12 - 10, h - 6); });
  var y0 = T + (h - T - Bm) * (1 - (START_CASH - mn) / (mx - mn));
  c.strokeStyle = '#9AA3B2'; c.setLineDash([2, 4]); c.beginPath(); c.moveTo(L, y0); c.lineTo(w - R, y0); c.stroke(); c.setLineDash([]);
  series.forEach(function (s) {
    if (s.d.length < 2) return;
    c.strokeStyle = s.col; c.lineWidth = 3; c.setLineDash(s.dash || []); c.beginPath();
    s.d.forEach(function (v2, j) { var x = L + (w - L - R) * j / totalPts, y = T + (h - T - Bm) * (1 - (v2 - mn) / (mx - mn)); if (j) c.lineTo(x, y); else c.moveTo(x, y); });
    c.stroke(); c.setLineDash([]);
  });
}

function codeInfo(code) {
  var mk = BBB.generate(code), sh = {}, cash = 0, def = false, dn = false;
  BBB.STOCKS.forEach(function (s) { sh[s.id] = (START_CASH / BBB.STOCKS.length) / s.price; });
  mk.months.forEach(function (mo) {
    BBB.STOCKS.forEach(function (s) { if (mo.payouts[s.id]) cash += sh[s.id] * mo.payouts[s.id]; });
    if (mo.split) sh[mo.split] *= 2;
    if (mo.defaulted) def = true; if (mo.downgraded) dn = true;
  });
  var v = cash; BBB.STOCKS.forEach(function (s) { v += sh[s.id] * BBB.startPrice(mk, s.id, 12); });
  return { year: mk.scenario, ret: v / START_CASH - 1, def: def, dn: dn };
}

function sha256hex(str) {
  if (!(window.crypto && crypto.subtle && window.TextEncoder)) return Promise.reject(new Error('no crypto'));
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(function (buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  });
}
function checkPin() {
  var msg = document.getElementById('t-pinmsg'), el = document.getElementById('t-pin');

  if (now < pinLockUntil) { msg.textContent = 'Too many tries. Wait ' + Math.ceil((pinLockUntil - now) / 1000) + ' seconds.'; return; }
  sha256hex(PIN_SALT + el.value.trim()).then(function (h) {
    if (h === PIN_HASH) {
      pinFails = 0;
      try { sessionStorage.setItem(KEY + '-teacher', PIN_HASH); } catch (e) { }
      teacherModal();
    } else {
      pinFails++; el.value = ''; SFX.wrong();
      if (pinFails >= 5) { pinLockUntil = Date.now() + 30000; pinFails = 0; msg.textContent = 'Too many tries. Wait 30 seconds.'; }

  if (act === 'teacher') return pinModal();
  if (act === 'pinok') return checkPin();
  if (act === 'tclose') { ovEl.innerHTML = ''; return; }
  if (act === 'tlock') { try { sessionStorage.removeItem(KEY + '-teacher'); } catch (e) { } ovEl.innerHTML = ''; flash('Teacher panel locked.'); return; }
  if (act === 'tcheck') return teacherCheck();
  if (act === 'answer') return answer(Number(b.getAttribute('data-i')));
  if (act === 'todesk') { S.phase = 'trade'; tab = 'stocks'; save(); SFX.click(); window.scrollTo(0, 0); return show(); }
  if (act === 'tab') { tab = b.getAttribute('data-t'); SFX.click(); return renderTrade(); }
  if (act === 'inc' || act === 'dec') {
    var el = document.getElementById('q-' + id); var q = Math.max(1, (Math.floor(Number(el.value)) || 0) + (act === 'inc' ? 1 : -1)); el.value = q; estimate(id); return;
  }
  if (act === 'max') return maxQty(id);
  if (act === 'buy') return buy(id);
  if (act === 'sell') return sell(id);
  if (act === 'runmonth') {
    var invested = Object.keys(S.hold).length > 0;
    if (!invested && !confirm('You have not bought anything. Cash earns nothing. Run the month anyway?')) return;
    S.phase = 'run'; save(); return show();
  }
  if (act === 'speed') { if (run) { run.speed = Number(b.getAttribute('data-s')); document.querySelectorAll('[data-act=speed]').forEach(function (x) { x.classList.toggle('ghost', x !== b); }); } return; }
  if (act === 'towrap') { setDock(''); return finishMonth(); }
  if (act === 'next') return nextMonth();
  if (act === 'again') { if (confirm('Start a brand new year? Take your screenshot first!')) { clearSave(); S = null; M = null; window.scrollTo(0, 0); show(); } return; }
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id && t.id.indexOf('q-') === 0) estimate(t.getAttribute('data-id'));
  if (t.id === 'f-refl') onReflect(t);
});
window.addEventListener('resize', function () {
  if (!S) return;
  if (S.phase === 'trade') drawSparks();
  if (S.phase === 'run') drawRunChart();
});
window.addEventListener('error', function (e) {
  try { console.error('Game error:', e.message); } catch (x) { }
});

/* ---------- boot ---------- */
show();

})();
</script>
</body>
</html>
